# infraestructura del agente: postgres con la extension pgvector
# se levanta desde la raiz con:  docker compose -f infra/docker-compose.yml up -d
# nombre de proyecto, contenedor, puerto y volumen propios para no chocar con
# los contenedores de hdt4 y hdt6 (que tambien viven en una carpeta "infra")

name: parachute-hdt7

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: parachute_pgvector_hdt7
    restart: unless-stopped
    environment:
      POSTGRES_USER: parachute
      POSTGRES_PASSWORD: parachute
      POSTGRES_DB: parachute
    ports:
      - "5436:5432"
    volumes:
      - parachute_hdt7_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parachute -d parachute"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parachute_hdt7_pgdata:
